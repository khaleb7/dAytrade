# Build from the repo root:
#   docker build -f apps/daytrader/Dockerfile -t daytrader:latest .
# Fires at :00 and :30 from 09:00–15:30 ET, plus :55, on weekdays.
# The process exits 0 unless the wall clock is an NYSE RTH tick (09:30–15:30).
# The sleeve is the daytrade. DAYTRADE_MODE is unset, so the 15:55 fire does not trade.
# Fifteen live sessions are credited on /data/scoreboard.json.
# DAYTRADE_MIN_SCORED_SESSIONS is 15, so the next session can submit.
# DAYTRADE_BREAKER=0.07 sells a sleeve name that trades 7% under its session open.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: daytrader-scoreboard
  namespace: daytrade
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daytrader
  namespace: daytrade
spec:
  schedule: "0,30,55 9-15 * * 1-5"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1500
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            fsGroup: 65532
          containers:
            - name: daytrader
              image: daytrader:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: NEWSTRACKER_URL
                  value: http://newstracker.daytrade.svc.cluster.local:8080
                - name: DAYTRADE_WORK
                  value: /work
                - name: DAYTRADE_MODEL
                  value: grok-4.7
                - name: DAYTRADE_PROPOSAL_WAIT_MINUTES
                  value: "20"
                - name: DAYTRADE_SCOREBOARD
                  value: /data/scoreboard.json
                - name: DAYTRADE_TARGETS
                  value: "QQQ:0.45,VTI:0.40"
                - name: DAYTRADE_REBALANCE_BAND
                  value: "0.05"
                - name: DAYTRADE_GAP_CUT
                  value: "0"
                - name: DAYTRADE_BREAKER
                  value: "0.07"
                - name: DAYTRADE_SPREAD_BPS
                  value: "5"
                - name: DAYTRADE_MIN_SCORED_SESSIONS
                  value: "15"
                - name: DAYTRADE_SCALP_SCOREBOARD
                  value: /data/scoreboard-scalp.json
                - name: DAYTRADE_SCALP_RESERVE
                  value: /data/scalp-reserve.json
                - name: DAYTRADE_EQUITY_OFFSET_USD
                  value: "0"
                - name: APCA_API_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: daytrade-secrets
                      key: APCA_API_KEY_ID
                - name: APCA_API_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: daytrade-secrets
                      key: APCA_API_SECRET_KEY
                - name: CURSOR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: daytrade-secrets
                      key: CURSOR_API_KEY
                - name: DAYTRADE_DISCORD_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: daytrade-secrets
                      key: DAYTRADE_DISCORD_WEBHOOK_URL
                      optional: true
                - name: APCA_API_BASE_URL
                  value: https://api.alpaca.markets
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: scoreboard
                  mountPath: /data
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 2Gi
          volumes:
            - name: work
              emptyDir: {}
            - name: scoreboard
              persistentVolumeClaim:
                claimName: daytrader-scoreboard
---
# 16:10 ET. Posts the Alpaca account to Discord. Does not trade and does not mount the scoreboard.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daytrader-eod
  namespace: daytrade
spec:
  schedule: "10 16 * * 1-5"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 180
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            fsGroup: 65532
          containers:
            - name: daytrader
              image: daytrader:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: NEWSTRACKER_URL
                  value: http://newstracker.daytrade.svc.cluster.local:8080
                - name: DAYTRADE_WORK
                  value: /work
                - name: DAYTRADE_MODEL
                  value: grok-4.7
                - name: DAYTRADE_PROPOSAL_WAIT_MINUTES
                  value: "20"
                - name: DAYTRADE_EQUITY_OFFSET_USD
                  value: "0"
                - name: APCA_API_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: daytrade-secrets
                      key: APCA_API_KEY_ID
                - name: APCA_API_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: daytrade-secrets
                      key: APCA_API_SECRET_KEY
                - name: CURSOR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: daytrade-secrets
                      key: CURSOR_API_KEY
                - name: DAYTRADE_DISCORD_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: daytrade-secrets
                      key: DAYTRADE_DISCORD_WEBHOOK_URL
                      optional: true
                - name: APCA_API_BASE_URL
                  value: https://api.alpaca.markets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
