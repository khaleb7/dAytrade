# Build from the repo root:
#   docker build -f apps/soupermarket/Dockerfile -t soupermarket:latest .
# Read-only day recap. Does not place orders.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soupermarket-data
  namespace: daytrade
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soupermarket
  namespace: daytrade
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soupermarket
  template:
    metadata:
      labels:
        app: soupermarket
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: soupermarket
          image: soupermarket:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APCA_API_BASE_URL
              value: https://api.alpaca.markets
            - name: SOUPER_DATA_URL
              value: https://data.alpaca.markets
            - name: APCA_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: daytrade-secrets
                  key: APCA_API_KEY_ID
            - name: APCA_API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: daytrade-secrets
                  key: APCA_API_SECRET_KEY
            - name: DAYTRADE_DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: daytrade-secrets
                  key: DAYTRADE_DISCORD_WEBHOOK_URL
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
            - name: work
              mountPath: /work
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: soupermarket-data
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: soupermarket
  namespace: daytrade
spec:
  selector:
    app: soupermarket
  ports:
    - name: http
      port: 8080
      targetPort: http
